services:
  retort:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: retort
    restart: unless-stopped
    ports:
      - "9847:9847"
    environment:
      - NODE_ENV=production
      - PORT=9847
      - HOSTNAME=0.0.0.0
      - ADMIN_SECRET=${ADMIN_SECRET:-RetortAdmin}
    env_file:
      - path: .env
        required: false
